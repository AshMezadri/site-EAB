<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo Personalidades</title>
  <link rel="stylesheet" href="styleAcervo.css">
</head>

<body>

  <div class="menu-topo">
    <h1 id="titulo-acervo">Acervo Personalidades</h1>
    <button id="btn-lupa" onclick="toggleModoLupa()">
      Lupa: OFF
    </button>
  </div>

<div class="acervo-grid" id="grade-acervo"></div>

  <button class="btn-home" onclick="window.location.href='enter.html'">Home</button>

  <div id="modal-zoom" onclick="fecharZoom()">
    <div class="modal-conteudo" onclick="event.stopPropagation()">
      <img id="img-zoom" src="" alt="Carta Ampliada">
      <p id="texto-zoom"></p>
      <p id="biografia-zoom"></p>
      <button class="btn-fechar-modal" onclick="fecharZoom()">Fechar</button>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    const grade = document.getElementById("grade-acervo");

    Object.keys(dadosPersonalidades).forEach((id) => {
      const pessoa = dadosPersonalidades[id];
      const item = document.createElement("div");
      item.classList.add("acervo-item");
      item.innerHTML = `
        <img src="${pessoa.carta}" alt="${pessoa.nome}">
        <span>${pessoa.nome}</span>
      `;
      item.onclick = () => abrirModalAcervo(id);
      grade.appendChild(item);
    });

    function abrirModalAcervo(id) {
      if (modoLupaAtivo) {
        const pessoa = dadosPersonalidades[id];
        document.getElementById("img-zoom").src = pessoa.carta;
        document.getElementById("texto-zoom").textContent = pessoa.nome;
        document.getElementById("biografia-zoom").textContent = pessoa.bio;
        document.getElementById("modal-zoom").style.display = "flex";
      }
    }
  </script>

</body>
</html>
