<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acervo Personalidades</title>
  <link rel="stylesheet" href="styleAcervo.css">
</head>

<body>

  <div class="menu-topo">
    <h1 id="titulo-acervo">Acervo Personalidades</h1>
    <button id="btn-lupa" onclick="toggleModoLupa()">
      Lupa: OFF
    </button>
  </div>

  <div class="acervo-grid" id="grade-acervo"></div>

  <button class="btn-home" onclick="window.location.href='enter.html'">Home</button>

  <div id="modal-zoom" onclick="fecharZoom()">
    <div class="modal-conteudo" onclick="event.stopPropagation()">
      <img id="img-zoom" src="" alt="Carta Ampliada">
      <p id="texto-zoom" style="margin-top: 15px; font-size: 24px; font-weight: 800; color: #333;"></p>

        <div style="display: flex; justify-content: center; gap: 12px; margin-top: 14px;">
          <button onclick="mudarTamanhoFonte(-2)" aria-label="Diminuir fonte"
            style="padding: 8px 18px; background: #eee; color: #333; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;">
            A-
          </button>
          <button onclick="mudarTamanhoFonte(2)" aria-label="Aumentar fonte"
            style="padding: 8px 18px; background: #eee; color: #333; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;">
            A+
          </button>
        </div>

        <p id="biografia-zoom"
          style="margin-top: 14px; font-size: 14px; font-weight: 500; color: #444; line-height: 1.5; text-align: justify; padding: 0 5px; font-family: system-ui, sans-serif;">
        </p>

        <button id="btn-ouvir" onclick="lerBiografia()"
          style="margin-top: 18px; margin-right: 10px; padding: 10px 22px; background: rgb(255, 153, 0); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;">
          Ouvir Texto
        </button>

        <button onclick="fecharZoom()"
          style="margin-top: 18px; padding: 10px 24px; background: rgb(167, 1, 26); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer;">
          Fechar
        </button>
    </div>
  </div>

  <script src="script.js"></script>

  <script>
    const grade = document.getElementById("grade-acervo");

    Object.keys(dadosPersonalidades).forEach((id) => {
      const pessoa = dadosPersonalidades[id];
      const item = document.createElement("div");
      item.classList.add("acervo-item");
      item.innerHTML = `
        <img src="${pessoa.carta}" alt="${pessoa.nome}">
        <span>${pessoa.nome}</span>
      `;
      item.onclick = () => abrirModalAcervo(id);
      grade.appendChild(item);
    });

    function abrirModalAcervo(id) {
      if (modoLupaAtivo) {
        const pessoa = dadosPersonalidades[id];
        document.getElementById("img-zoom").src = pessoa.carta;
        document.getElementById("texto-zoom").textContent = pessoa.nome;
        document.getElementById("biografia-zoom").textContent = pessoa.bio;
        document.getElementById("modal-zoom").style.display = "flex";
      }
    }
  </script>

</body>

</html>
