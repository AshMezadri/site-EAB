  <div id="modal-zoom" onclick="fecharZoom()">
    <div class="modal-conteudo" onclick="event.stopPropagation()">
      <img id="img-zoom" src="" alt="Carta Ampliada">
      <p id="texto-zoom"></p>
      <p id="biografia-zoom"></p>
      <button class="btn-fechar-modal" onclick="fecharZoom()">Fechar</button>
    </div>
  </div>

  <script>
    let modoLupaAtivo = false;

    function toggleModoLupa() {
      modoLupaAtivo = !modoLupaAtivo;
      const btn = document.getElementById("btn-lupa");
      if (modoLupaAtivo) {
        btn.textContent = "Lupa: ON";
        btn.style.background = "#ff4444";
      } else {
        btn.textContent = "Lupa: OFF";
        btn.style.background = "rgb(167, 1, 26)";
      }
    }

    function verificarCliqueItem(elemento) {
      if (modoLupaAtivo) {
        let imgUrl = elemento.querySelector("img").src;
        let nomePersonagem = elemento.querySelector("span").textContent;
        
        let biografia = elemento.getAttribute("data-bio") || "Biografia não cadastrada para esta personalidade.";

        document.getElementById("img-zoom").src = imgUrl;
        document.getElementById("texto-zoom").textContent = nomePersonagem; 
        document.getElementById("biografia-zoom").textContent = biografia; 
        document.getElementById("modal-zoom").style.display = "flex";
      }
    }

    function fecharZoom() {
      document.getElementById("modal-zoom").style.display = "none";
    }
  </script>
