<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./res/favicon.ico" type="image/x-icon">
  <title>Créditos - Personalidades Negras</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: rgb(167, 1, 26);
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 30px;
      color: #fff;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .container {
      background: #fff;
      padding: 35px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .barra-acessibilidade {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .btn-fonte {
      padding: 8px 18px;
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-fonte:hover {
      background: #e8e8e8;
    }

    .btn-audio {
      padding: 8px 20px;
      background: rgb(255, 153, 0);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-audio:hover {
      background: #ff4444;
    }

    .bloco-disciplina {
      margin-bottom: 22px;
    }

    .titulo {
      font-size: 17px;
      color: #222;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .nomes-profs {
      font-size: 15px;
      color: #555;
      font-weight: 500;
    }

    .divisoria {
      border: none;
      height: 1px;
      background: #ececec;
      margin: 22px auto;
      width: 85%;
    }

    .bloco-equipe {
      margin-bottom: 22px;
    }

    .titulo-equipe {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      font-weight: 700;
      display: block;
      margin-bottom: 10px;
    }

    .lista-integrantes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      color: #222;
      font-weight: 600;
      line-height: 1.6;
    }

    .separador-ponto {
      color: #ccc;
      user-select: none;
    }

    .bloco-jogo {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .link-credito {
      color: rgb(167, 1, 26);
      text-decoration: none;
      font-weight: 700;
    }

    .link-credito:hover {
      text-decoration: underline;
    }

    .btn-home {
      width: 200px;
      height: 50px;
      background: rgb(255, 153, 0);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-home:hover {
      background: #ff4444;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(255, 68, 68, 0.2);
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 24px;
      }

      .container {
        padding: 25px 20px 30px 20px;
      }

      .titulo-disciplina {
        font-size: 16px;
      }

      .nomes-profs,
      .lista-integrantes {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="barra-acessibilidade">
      <button class="btn-fonte" onclick="mudarFonteCreditos(-2)" aria-label="Diminuir fonte">A-</button>
      <button class="btn-fonte" onclick="mudarFonteCreditos(2)" aria-label="Aumentar fonte">A+</button>
      <button class="btn-audio" id="btn-ouvir-creditos" onclick="lerCreditos()">Ouvir Texto</button>
    </div>

    <div id="conteudo-creditos">

      <div class="bloco-disciplina">
        <p class="titulo texto-ajustavel">Nome da Disciplina 2026.2</p>
        <p class="nomes-profs texto-ajustavel">Nome da Professora - Nome da Estagiária</p>
      </div>

      <hr class="divisoria" />

      <div class="bloco-equipe">
        <span class="titulo-equipe texto-ajustavel">Equipe</span>
        <div class="lista-integrantes texto-ajustavel">
          <span>Ash Armanini Mezadri</span>
          <span class="separador-ponto">•</span>
          <span>Fernanda ...</span>
          <span class="separador-ponto">•</span>
          <span>Debora ...</span>
          <span class="separador-ponto">•</span>
          <span>Sah</span>
          <span class="separador-ponto">•</span>
          <span>Thiago</span>
        </div>
      </div>

      <hr class="divisoria" />

      <div class="bloco-jogo">
        <p class="texto-ajustavel">
          inspirado no projeto de <a href="https://codingnepalweb.com" target="_blank" rel="noopener noreferrer"
            class="link-credito">CodingNepal</a>.
        </p>
      </div>

    </div>

    <button class="btn-home" onclick="voltarHome()">Voltar</button>
  </div>

  <script>
    let tamanhoFonteCreditos = 15;
    let falando = false;

    function mudarFonteCreditos(alteracao) {
      tamanhoFonteCreditos += alteracao;
      if (tamanhoFonteCreditos < 13) tamanhoFonteCreditos = 13;
      if (tamanhoFonteCreditos > 24) tamanhoFonteCreditos = 24;

      const textos = document.querySelectorAll(".texto-ajustavel");
      textos.forEach((el) => {
        el.style.fontSize = `${tamanhoFonteCreditos}px`;
      });
    }

    function lerCreditos() {
      const btn = document.getElementById("btn-ouvir-creditos");

      if (falando) {
        window.speechSynthesis.cancel();
        falando = false;
        btn.textContent = "Ouvir Texto";
        return;
      }

      window.speechSynthesis.cancel();
      const textoCompleto = document.getElementById("conteudo-creditos").innerText;
      const fala = new SpeechSynthesisUtterance(textoCompleto);
      fala.lang = "pt-BR";

      falando = true;
      btn.textContent = "Parar Áudio";

      fala.onend = () => {
        falando = false;
        btn.textContent = "Ouvir Texto";
      };

      window.speechSynthesis.speak(fala);
    }

    function voltarHome() {
      window.speechSynthesis.cancel();
      window.location.href = "enter.html";
    }
  </script>

</body>

</html>
